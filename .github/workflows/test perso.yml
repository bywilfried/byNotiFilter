name: Build APK perso

on:
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin
          cache: gradle

      - name: Donner les droits à Gradle
        run: chmod +x ./gradlew

      - name: Compiler l'APK
        run: ./gradlew app:assembleNightly

      - name: Préparer l'APK
        run: |
          mkdir -p build-apk
          cp app/build/outputs/apk/nightly/*.apk build-apk/NotiFilter.apk

      - name: Mettre l'APK à disposition
        uses: actions/upload-artifact@v4
        with:
          name: NotiFilter-APK
          path: build-apk/NotiFilter.apk
          retention-days: 7
