name: Build signed NotiFlow APKs

on:
  workflow_dispatch:

jobs:
  build:
    name: Build dev and release APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin
          cache: gradle

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Restore signing keystore
        env:
          KEYSTORE_FILE: ${{ secrets.KEYSTORE_FILE }}
        run: |
          printf '%s' "$KEYSTORE_FILE" | base64 --decode > "$RUNNER_TEMP/notiflow.jks"

      - name: Build signed dev and release APKs
        env:
          NOTIFLOW_KEYSTORE_PATH: ${{ runner.temp }}/notiflow.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew app:assembleNightly app:assembleRelease

      - name: Prepare APK files
        run: |
          mkdir -p build-apk
          DEV_APK=$(find app/build/outputs/apk/nightly -maxdepth 1 -type f -name '*.apk' | head -n 1)
          RELEASE_APK=$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -n 1)
          test -n "$DEV_APK"
          test -n "$RELEASE_APK"
          cp "$DEV_APK" build-apk/NotiFlow-app-dev.apk
          cp "$RELEASE_APK" build-apk/NotiFlow-app-release.apk

      - name: Verify APK signatures
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          "$APKSIGNER" verify --verbose --print-certs build-apk/NotiFlow-app-dev.apk
          "$APKSIGNER" verify --verbose --print-certs build-apk/NotiFlow-app-release.apk

      - name: Upload signed APKs
        uses: actions/upload-artifact@v4
        with:
          name: NotiFlow-APKs
          path: |
            build-apk/NotiFlow-app-dev.apk
            build-apk/NotiFlow-app-release.apk
          retention-days: 7
